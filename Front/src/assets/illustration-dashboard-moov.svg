  <text x="220" y="105" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">$</text>
  
  <!-- Person -->
  <ellipse cx="280" cy="200" rx="45" ry="55" fill="#002a7a"/>
  <circle cx="280" cy="175" r="18" fill="#d4a574"/>
  <path d="M 265 172 Q 270 165 275 172" fill="#002a7a"/>
  <ellipse cx="260" cy="220" rx="30" ry="35" fill="#7ba3d9"/>
  <path d="M 240 210 Q 230 200 220 205 L 230 230 L 250 225 Z" fill="#7ba3d9"/>
  <path d="M 320 210 Q 330 200 340 205 L 330 230 L 310 225 Z" fill="#7ba3d9"/>
  
