  <circle cx="350" cy="120" r="6" fill="#e05500" opacity="0.3"/>
  <rect x="330" y="380" width="10" height="10" fill="#002a7a" opacity="0.3"/>
  
  <!-- Checklist card (left side) -->
  <rect x="40" y="220" width="100" height="80" rx="8" fill="#002a7a"/>
  <line x1="55" y1="240" x2="70" y2="240" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <rect x="50" y="235" width="10" height="10" rx="2" fill="white" opacity="0.3"/>
  <line x1="55" y1="260" x2="70" y2="260" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <rect x="50" y="255" width="10" height="10" rx="2" fill="white" opacity="0.3"/>
