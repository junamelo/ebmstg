  <rect x="50" y="275" width="10" height="10" rx="2" fill="white" opacity="0.3"/>
  
  <!-- Invoice/Bill (center-left) -->
  <path d="M 100 80 L 240 80 L 240 260 L 220 240 L 200 260 L 180 240 L 160 260 L 140 240 L 120 260 L 100 240 Z" fill="#b8c5e0"/>
  <rect x="115" y="100" width="80" height="8" rx="4" fill="white"/>
  <rect x="115" y="120" width="100" height="6" rx="3" fill="white"/>
  <rect x="115" y="135" width="90" height="6" rx="3" fill="white"/>
  
  <!-- Dollar coin -->
