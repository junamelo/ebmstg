  <circle cx="310" cy="270" r="25" fill="#6b46c1"/>
  <path d="M 300 270 Q 300 260 310 260 Q 320 260 320 270" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 320 270 Q 320 280 310 280 Q 300 280 300 270" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="323,267 328,270 323,273" fill="white"/>
  
